<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHub — Campus Events & Registrations</title>
  <script src="styles.js"></script>
</head>
<body>
  <header>
    <h1 id="app-name">EventHub</h1>
    <p id="tagline">Register for college activities and events.</p>
    <span id="status-badge" class="badge">Checking API...</span>
  </header>

  <nav class="tabs">
    <button id="tab-attendee">🎟️ Register</button>
    <button id="tab-organizer">📋 Organizer Dashboard</button>
  </nav>

  <main>
    <!-- Attendee view: register for an event -->
    <section id="attendee-view" class="card">
      <h2>Register for an event</h2>
      <form id="registration-form">
        <label for="event-title">Event name *</label>
        <input id="event-title" name="eventTitle" required placeholder="e.g. Annual Tech Fest" />

        <label for="event-description">Description</label>
        <textarea id="event-description" name="description" placeholder="What's this event about?"></textarea>

        <div class="row">
          <div>
            <label for="event-category">Category</label>
            <select id="event-category" name="category"></select>
          </div>
          <div>
            <label for="event-date">Date</label>
            <input id="event-date" name="eventDate" type="date" />
          </div>
        </div>

        <label for="event-venue">Venue</label>
        <input id="event-venue" name="venue" placeholder="e.g. Main Auditorium" />

        <div class="row">
          <div>
            <label for="student-name">Your name *</label>
            <input id="student-name" name="studentName" required placeholder="Full name" />
          </div>
          <div>
            <label for="student-email">Your email</label>
            <input id="student-email" name="studentEmail" type="email" placeholder="you@college.edu" />
          </div>
        </div>

        <button type="submit">Register</button>
        <div id="register-feedback" class="feedback"></div>
      </form>
    </section>

    <!-- Organizer view: manage registrations -->
    <section id="organizer-view" class="card hidden">
      <h2>Registrations</h2>
      <div class="filters">
        <select id="filter-status"></select>
        <select id="filter-category"></select>
        <button id="refresh-btn">Refresh</button>
      </div>
      <div id="registration-list"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
