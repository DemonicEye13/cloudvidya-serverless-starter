AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  EventHub backend — register students for college activities and events.
  Frontend -> API Gateway -> Lambda -> DynamoDB, same shape as the
  CloudVidya reference architecture, with PATCH /items/{id} added.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12

Resources:
  EventHubTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-eventhub"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  EventHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      CodeUri: backend/
      Environment:
        Variables:
          TABLE_NAME: !Ref EventHubTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventHubTable
      Events:
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: GET
        CreateRegistration:
          Type: Api
          Properties:
            Path: /items
            Method: POST
        ListRegistrations:
          Type: Api
          Properties:
            Path: /items
            Method: GET
        UpdateRegistration:
          Type: Api
          Properties:
            Path: /items/{id}
            Method: PATCH
        Preflight:
          Type: Api
          Properties:
            Path: /items
            Method: OPTIONS
        PreflightWithId:
          Type: Api
          Properties:
            Path: /items/{id}
            Method: OPTIONS
        HealthPreflight:
          Type: Api
          Properties:
            Path: /health
            Method: OPTIONS

Outputs:
  ApiUrl:
    Description: "Invoke URL — paste this into frontend/config.js as API_BASE_URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TableName:
    Description: "DynamoDB table name"
    Value: !Ref EventHubTable